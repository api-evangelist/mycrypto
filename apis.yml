aid: mycrypto
name: MyCrypto
description: 'MyCrypto is a free, open-source, client-side interface for managing Ethereum
  accounts and interacting with the Ethereum blockchain. Founded in 2015, it is a non-custodial
  wallet — private keys never leave the user''s device — supporting hardware wallets, Web3
  and browser wallets, and offline transaction signing. In February 2022 MyCrypto was
  acquired by ConsenSys to consolidate with MetaMask and unify the Web3 wallet experience.
  MyCrypto ships no public REST API; its developer surface is the open-source application
  codebase and the JavaScript/TypeScript libraries (eth-scan, ethereum-blockies-base64,
  asset mappings) published under the MyCryptoHQ GitHub organization.'
